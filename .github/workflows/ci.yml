name: Investigate logging helper
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: nightly-2026-10-12-2664a27
      - name: Download the failing bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 39509439394 -R roc-lang/basic-cli -n release-bundles -D /tmp/026-probe-bundles
      - name: Reproduce with controlled stack sizes
        run: |
          python3 -m http.server 18080 --directory /tmp/026-probe-bundles > /tmp/bundle-server.log 2>&1 &
          trap 'kill $!' EXIT
          python3 - <<'PY'
          from pathlib import Path
          import resource, subprocess, time
          time.sleep(1)
          archive=next(Path('/tmp/026-probe-bundles').glob('*.tar.zst'))
          source=Path('tests/cmd-api.roc').read_text().replace('../platform/main.roc', 'http://127.0.0.1:18080/'+archive.name)
          Path('/tmp/026-probe.roc').write_text(source)
          subprocess.run(['roc','build','--no-cache','/tmp/026-probe.roc','--output=/tmp/026-probe'],check=True)
          print('Original stack:', resource.getrlimit(resource.RLIMIT_STACK),flush=True)
          for kb in [8192,16384,32768,65536]:
              def limit(kb=kb):
                  _,hard=resource.getrlimit(resource.RLIMIT_STACK)
                  resource.setrlimit(resource.RLIMIT_STACK,(kb*1024,hard))
              with open('/tmp/026-probe-output','wb') as output:
                  result=subprocess.run(['/tmp/026-probe','--helper','flood'],stdout=output,stderr=subprocess.PIPE,preexec_fn=limit,timeout=30)
              print('stack KiB',kb,'exit',result.returncode,'bytes',Path('/tmp/026-probe-output').stat().st_size,'stderr',result.stderr.decode(errors='replace'),flush=True)
          import os
          for label,args in [('original-loop',['--helper','flood']),('parent-file-redirection',[])]:
              failures=[]
              for attempt in range(40 if args else 5):
                  with open('/tmp/probe-stress-output','wb') as output:
                      result=subprocess.run(['/tmp/026-probe',*args],stdout=output,stderr=subprocess.PIPE,timeout=60,env={**os.environ,'CMD_TEST_INHERITED':'yes'})
                  if result.returncode:
                      failures.append((attempt,result.returncode,Path('/tmp/probe-stress-output').stat().st_size,result.stderr.decode(errors='replace')))
              print('STRESS',label,'failures',failures,flush=True)
          # Match the release runner's explicit target and cache warm-up.
          Path('/tmp/026-cached.roc').write_text(source)
          subprocess.run(['roc','check','/tmp/026-cached.roc','--max-transitive-mb=256'],check=True)
          subprocess.run(['roc','test','/tmp/026-cached.roc','--max-transitive-mb=256'],check=True)
          for label,flags in [('explicit-cached',[]),('explicit-no-cache',['--no-cache'])]:
              subprocess.run(['roc','build','/tmp/026-cached.roc','--target=x64musl','--output=/tmp/026-cached','--max-transitive-mb=256',*flags],check=True)
              with open('/tmp/cached-helper-output','wb') as output:
                  helper=subprocess.run(['/tmp/026-cached','--helper','flood'],stdout=output,stderr=subprocess.PIPE,timeout=30)
              with open('/tmp/cached-parent-output','wb') as output:
                  parent=subprocess.run(['/tmp/026-cached'],stdout=output,stderr=subprocess.PIPE,timeout=60,env={**os.environ,'CMD_TEST_INHERITED':'yes'})
              print('COMPILER',label,'helper',helper.returncode,'bytes',Path('/tmp/cached-helper-output').stat().st_size,'parent',parent.returncode,'stderr',parent.stderr.decode(errors='replace'),flush=True)
          # Compare a heap payload to the literal used by the effectful loop.
          changed=source.replace('"0123456789abcdef".to_utf8()', "List.repeat('x', 16)")
          Path('/tmp/026-dynamic.roc').write_text(changed)
          subprocess.run(['roc','build','--no-cache','/tmp/026-dynamic.roc','--output=/tmp/026-dynamic'],check=True)
          result=subprocess.run(['/tmp/026-dynamic','--helper','flood'],stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=30)
          print('dynamic payload loop exit',result.returncode,'stderr',result.stderr.decode(errors='replace'),flush=True)
          failures=[]
          for attempt in range(40):
              result=subprocess.run(['/tmp/026-dynamic','--helper','flood'],stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=30)
              if result.returncode:
                  failures.append((attempt,result.returncode,result.stderr.decode(errors='replace')))
          print('STRESS dynamic-payload-loop failures',failures,flush=True)
          PY
